[tool.poetry]
name = "dubpar-backend"
version = "0.1.0"
description = "DubPar - образовательный проект по РПО"
authors = ["SyrekAI <syreksai@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.115.0"
starlette = "^0.46.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
sqlalchemy = "^2.0.36"
pwdlib = {extras = ["argon2", "bcrypt"], version = "^0.2.1"}
python-multipart = "^0.0.20"
psycopg = {extras = ["binary"], version = "^3.2.0"}
python-dotenv = "^1.0.0"
pydantic-settings = "^2.7.0"
email-validator = "^2.0.0"
websockets = "^17.0.0"
httpx = "^0.28.0"
redis = "^5.0.0"
alembic = "^1.14.0"
pillow = "^11.1.0"
pyjwt = "^2.10.0"
pyotp = "^2.9.0"
minio = "^7.2.15"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.28.0"
ruff = "^0.9.0"
mypy = "^1.14.0"
faker = "^40.32.0"
pytest-asyncio = "^0.25.0"
aiosqlite = "^0.21.0"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
